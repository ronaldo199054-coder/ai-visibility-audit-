  "想找一家靠谱的本地咖啡供应商，有推荐吗？",
  "小公司做品牌宣传，有什么性价比高的办法？",
  "示例品牌是做什么的？",
]

[model]
base_url = "https://api.example.com/v1"
model = "your-model-name"
max_tokens = 800
